<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoración de Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Valorar Ticket</h2>
        <form id="formValoracion">
            <label for="id_ticket">ID Ticket:</label>
            <input type="number" id="id_ticket" required>

            <label for="id_usuario">ID Usuario:</label>
            <input type="number" id="id_usuario" required>

            <label for="estrellas">Estrellas:</label>
            <select id="estrellas" required>
                <option value="1">1 Estrella</option>
                <option value="2">2 Estrellas</option>
                <option value="3">3 Estrellas</option>
                <option value="4">4 Estrellas</option>
                <option value="5">5 Estrellas</option>
            </select>

            <label for="comentario">Comentario (opcional):</label>
            <textarea id="comentario"></textarea>

            <button type="submit">Enviar Valoración</button>
        </form>

        <h2>Ver Valoraciones</h2>
        <input type="number" id="id_ticket_buscar" placeholder="ID Ticket">
        <button onclick="verValoraciones()">Ver Valoraciones</button>

        <div id="valoraciones"></div>
    </div>

    <script>
        document.getElementById("formValoracion").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let id_ticket = document.getElementById("id_ticket").value;
            let id_usuario = document.getElementById("id_usuario").value;
            let estrellas = document.getElementById("estrellas").value;
            let comentario = document.getElementById("comentario").value;

            let formData = new FormData();
            formData.append("id_ticket", id_ticket);
            formData.append("id_usuario", id_usuario);
            formData.append("estrellas", estrellas);
            formData.append("comentario", comentario);

            fetch("guardar_valoracion.php", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert(data.mensaje || data.error);
            });
        });

        function verValoraciones() {
            let id_ticket = document.getElementById("id_ticket_buscar").value;

            fetch("ver_valoraciones.php?id_ticket=" + id_ticket)
            .then(response => response.json())
            .then(data => {
                let output = `<h3>Valoraciones:</h3><table>
                                <tr><th>Estrellas</th><th>Comentario</th></tr>`;

                data.forEach(val => {
                    output += `<tr>
                                <td>${val.estrellas} ⭐</td>
                                <td>${val.comentario || "Sin comentario"}</td>
                               </tr>`;
                });

                output += "</table>";
                document.getElementById("valoraciones").innerHTML = output;
            });
        }
    </script>
</body>
</html>
